#!/sbin/nft -f
# ==============================================================================
# /etc/nftables.conf
# Arch Linux — Laptop
# Setup: Psiphon VPN, libvirt/virt-manager, Docker, systemd-resolved
# Output: gated by allow-internet GID except system services (DNS/NTP/DHCP)
#
# Groups:
#   allow-internet  — processes allowed full outbound TCP/UDP
#                     (add: browser, Psiphon, pacman, curl, syncthing, etc.)
#
# IPv6: disabled at kernel level via sysctl (net.ipv6.conf.all.disable_ipv6=1)
#       If you re-enable IPv6, add ip6 rules here.
#
# Captive portals / university networks:
#   Psiphon must be in the allow-internet group.
#   It binds a local SOCKS5 proxy (127.0.0.1:1080) and HTTP proxy (:8080).
#   Configure your browser to use those proxies — all traffic then tunnels
#   through Psiphon regardless of the network's DNS blocking.
#   systemd-resolved handles local DNS; Psiphon handles tunnel DNS internally.
#
# Usage after editing:
#   sudo nft -c -f /etc/nftables.conf   # dry-run / syntax check
#   sudo systemctl restart nftables
# ==============================================================================

flush ruleset

table inet filter {

  # ============================================================
  # INPUT
  # ============================================================
  chain input {
    type filter hook input priority 0; policy drop;

    # Drop invalid state early
    ct state invalid drop comment "drop invalid packets"

    # Loopback — always accept
    iif lo accept comment "accept loopback"

    # Drop non-loopback traffic claiming loopback destination
    iif != lo ip  daddr 127.0.0.1/8 counter drop comment "anti-spoof loopback IPv4"

    # Accept established / related
    ct state { established, related } accept comment "accept established/related"

    # ICMP — rate-limited echo-request, accept all other ICMP types
    ip protocol icmp icmp type echo-request limit rate 3/second accept
    ip protocol icmp icmp type echo-request counter drop comment "drop excess pings"
    ip protocol icmp counter accept comment "accept all other ICMPv4"

    # DHCP renewals
    udp sport 67 udp dport 68 counter accept comment "DHCP client"

    # libvirt — VMs reach host DNS (dnsmasq on virbr0) and DHCP
    iifname "virbr*" udp dport 53 counter accept comment "VM -> host dnsmasq DNS"
    iifname "virbr*" tcp dport 53 counter accept comment "VM -> host dnsmasq DNS (TCP)"
    iifname "virbr*" udp dport 67 counter accept comment "VM -> host dnsmasq DHCP"

    # Docker — containers reach host DNS and DHCP
    iifname "docker*" udp dport 53 counter accept comment "container -> host DNS"
    iifname "docker*" tcp dport 53 counter accept comment "container -> host DNS (TCP)"
    iifname "docker*" udp dport 67 counter accept comment "container -> host DHCP"

    # Log and drop everything else (rate-limited to avoid journal floods)
    limit rate 10/second burst 20 packets log flags all prefix "FIREWALL REJECTED INPUT: " counter
    # implicit drop by policy
  }

  # ============================================================
  # FORWARD
  # ============================================================
  chain forward {
    type filter hook forward priority 0; policy drop;

    # Accept established / related forwarded connections
    ct state { established, related } counter accept comment "accept established/related forward"

    # libvirt VMs -> internet through host
    iifname "virbr*" oifname != "virbr*" counter accept comment "VM -> WAN"
    iifname != "virbr*" oifname "virbr*" ct state { established, related } counter accept comment "WAN -> VM reply"

    # Docker containers -> internet through host
    iifname "docker*" oifname != "docker*" counter accept comment "container -> WAN"
    iifname != "docker*" oifname "docker*" ct state { established, related } counter accept comment "WAN -> container reply"

    # Log and explicitly reject everything else
    limit rate 10/second burst 20 packets log flags all prefix "FIREWALL REJECTED FORWARD: " counter
    reject with icmp type port-unreachable comment "explicit reject"
  }

  # ============================================================
  # OUTPUT
  # ============================================================
  chain output {
    type filter hook output priority 0; policy drop;

    # Loopback
    oif lo accept comment "accept loopback"

    # Accept established / related first (most traffic hits this)
    ct state { established, related } accept comment "accept established/related"

    # Drop invalid
    ct state invalid drop comment "drop invalid outbound"

    # ICMP outbound — always allow (ping, traceroute, PMTUD)
    ip protocol icmp counter accept comment "allow all outbound ICMPv4"

    # DHCP client (must be before GID check — no socket GID at this layer)
    udp sport 68 udp dport 67 counter accept comment "DHCP client"

    # NTP — systemd-timesyncd runs as its own user, not allow-internet
    udp dport 123 counter accept comment "NTP (systemd-timesyncd)"

    # DNS — systemd-resolved stub listener on 127.0.0.53
    # Allow all processes to reach resolved locally
    ip daddr 127.0.0.53 udp dport 53 counter accept comment "-> systemd-resolved stub (UDP)"
    ip daddr 127.0.0.53 tcp dport 53 counter accept comment "-> systemd-resolved stub (TCP)"

    # DNS outbound (resolved -> upstream) — gated to allow-internet group
    # On captive/university networks, Psiphon handles upstream DNS internally.
    # systemd-resolved is in allow-internet (or runs as resolved user — add to group).
    udp dport 53 meta skgid allow-internet counter accept comment "upstream DNS UDP (allow-internet)"
    tcp dport 53 meta skgid allow-internet counter accept comment "upstream DNS TCP (allow-internet)"

    # DNS over TLS — gated (resolved uses this for encrypted upstream)
    tcp dport 853 meta skgid allow-internet counter accept comment "DoT (allow-internet)"

    # libvirt / Docker host -> VM / container
    oifname "virbr*" counter accept comment "host -> VM"
    oifname "docker*" counter accept comment "host -> container"

    # SyncThing — gated
    tcp dport 22000 meta skgid allow-internet counter accept comment "SyncThing TCP (allow-internet)"
    udp dport 22000 meta skgid allow-internet counter accept comment "SyncThing UDP (allow-internet)"

    # DEV ONLY: Allow user aymen (UID 1000) full internet access for development
    # Remove this rule in production — use allow-internet group instead
    meta skuid 1000 counter accept comment "DEV: aymen user internet access"

    # General outbound TCP/UDP for allow-internet group
    # Covers: browser, Psiphon (80/443/8080/any), pacman, curl, ssh, etc.
    ip protocol tcp meta skgid allow-internet counter accept comment "TCP outbound (allow-internet)"
    ip protocol udp meta skgid allow-internet counter accept comment "UDP outbound (allow-internet)"

    # Log blocked outbound (rate-limited)
    limit rate 10/second burst 20 packets log flags all prefix "FIREWALL REJECTED OUTPUT: " counter
    reject with icmp type port-unreachable comment "explicit reject"
  }
}