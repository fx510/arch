# ==============================================================================
# /etc/sysctl.d/99-hardening.conf
# Arch Linux — Laptop
# Setup: Psiphon VPN, libvirt/virt-manager, Docker, systemd-resolved
#
# Apply  : sudo sysctl --system
# Verify : sudo sysctl -a | grep <key>
# ==============================================================================


# ------------------------------------------------------------------------------
# KERNEL HARDENING
# ------------------------------------------------------------------------------

# Full ASLR
kernel.randomize_va_space=2

# Hide kernel pointers from unprivileged users
kernel.kptr_restrict=2

# Restrict dmesg to root
kernel.dmesg_restrict=1

# Restrict perf_events to root (side-channel mitigation)
kernel.perf_event_paranoid=3

# Disable kexec (anti-persistence)
kernel.kexec_load_disabled=1

# Disable unprivileged eBPF
kernel.unprivileged_bpf_disabled=1

# Harden BPF JIT
net.core.bpf_jit_harden=2

# Restrict ptrace to parent only
# NOTE: lower to 1 if Wine or some debuggers break
kernel.yama.ptrace_scope=2

# Disable SysRq
kernel.sysrq=0

# Disable NMI watchdog (saves power)
kernel.nmi_watchdog=0

# Suppress kernel console messages
kernel.printk=3 3 3 3

# Append PID to core dumps
kernel.core_uses_pid=1

# Discard core dumps for SUID programs
fs.suid_dumpable=0
kernel.core_pattern=|/bin/false

# Reboot 10s after kernel panic
kernel.panic=10
kernel.panic_on_oops=1

# Shared memory
kernel.shmall=268435456
kernel.shmmax=1073741824


# ------------------------------------------------------------------------------
# FILESYSTEM HARDENING
# ------------------------------------------------------------------------------

fs.protected_hardlinks=1
fs.protected_symlinks=1
fs.protected_fifos=2
fs.protected_regular=2
dev.tty.ldisc_autoload=0


# ------------------------------------------------------------------------------
# MEMORY — laptop tuned
# ------------------------------------------------------------------------------

vm.swappiness=10
vm.overcommit_memory=0
vm.dirty_writeback_centisecs=6000
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.laptop_mode=5
vm.vfs_cache_pressure=50
vm.mmap_min_addr=65536
vm.mmap_rnd_bits=32
vm.mmap_rnd_compat_bits=16
vm.max_map_count=1048576
vm.unprivileged_userfaultfd=0


# ------------------------------------------------------------------------------
# NETWORK — IPv4
# ------------------------------------------------------------------------------

# REQUIRED for libvirt VMs and Docker containers to reach the internet
net.ipv4.ip_forward=1

# Disable ICMP redirect acceptance — all current + future interfaces
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0

# Accept redirects only from known gateways
net.ipv4.conf.all.secure_redirects=1
net.ipv4.conf.default.secure_redirects=1

# Do not send ICMP redirects
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0

# Disable source routing
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0

# Reverse path filtering — anti-spoofing
# NOTE: set to loose (2) on interfaces used by libvirt/Docker to avoid
# dropping asymmetric routed packets from VMs/containers
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1

# Log martian packets
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1

# Ignore broadcast pings
net.ipv4.icmp_echo_ignore_broadcasts=1

# Ignore bogus ICMP errors
net.ipv4.icmp_ignore_bogus_error_responses=1

# SYN flood protection
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_max_syn_backlog=2048

# RFC 1337 TIME_WAIT protection
net.ipv4.tcp_rfc1337=1

# Reduce SYN/SYN-ACK retries
net.ipv4.tcp_syn_retries=5
net.ipv4.tcp_synack_retries=2

# Disable TCP timestamps (uptime fingerprinting)
# NOTE: Psiphon tunnels traffic so this is less critical, but kept for
# connections before the tunnel is up
net.ipv4.tcp_timestamps=0

# ARP neighbour table
net.ipv4.neigh.default.gc_thresh1=32
net.ipv4.neigh.default.gc_thresh2=1024
net.ipv4.neigh.default.gc_thresh3=2048

net.ipv4.conf.all.proxy_arp=0


# ------------------------------------------------------------------------------
# NETWORK — IPv6
# Disabled: Psiphon tunnels IPv4 only; leaving IPv6 up causes leak outside tunnel.
# Remove the two disable lines if you re-enable IPv6 and add ip6 nftables rules.
# ------------------------------------------------------------------------------

net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1

# These apply if IPv6 is re-enabled:
net.ipv6.conf.all.accept_ra=0
net.ipv6.conf.default.accept_ra=0
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0
net.ipv6.conf.all.forwarding=0
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2