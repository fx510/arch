    usbutils
    dmidecode
    bluez
    bluez-utils
    
    # Notification daemon
    dunst
    libnotify
    
    # GTK themes
    gtk3
    gtk4
    
    # Audit system (for your security setup)
    audit
    
    # Firewall (for your security setup)
    nftables
    
