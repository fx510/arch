    hyprland
    xdg-desktop-portal-hyprland
    qt5-wayland
    qt6-wayland
    
    # Display manager
    sddm
    
    # GPU Drivers - Intel + NVIDIA
    # Intel integrated graphics
    mesa
    vulkan-intel
    intel-media-driver
    libva-intel-driver
    
    # # NVIDIA discrete graphics
    # nvidia
    # nvidia-utils
    # nvidia-settings
    
    # Audio
    pipewire
    pipewire-alsa
    pipewire-pulse
    pipewire-jack
    wireplumber
    
    # Hyprland utilities
    polkit-kde-agent
    wl-clipboard
    cliphist
    brightnessctl
    playerctl
    grim
    slurp
    swappy
    imagemagick
    jq
    
    # Terminal & Shell
    kitty
    zsh
    zsh-autosuggestions
    zsh-completions
    zsh-syntax-highlighting
    
    # File management
    thunar
    thunar-archive-plugin
