#
# /etc/audit/auditd.conf
# Arch Linux Workstation Balanced Profile
# Optimized for:
# - lower SSD wear
# - useful forensic visibility
# - desktop responsiveness
# - Hyprland / modern Linux desktop usage
#

# ============================================================
# CORE LOGGING
# ============================================================

# Collect local events
local_events = yes

# Main audit log location
log_file = /var/log/audit/audit.log

# Enable disk logging
write_logs = yes

# Human-readable usernames/groups in logs
# RAW is slightly faster, ENRICHED easier to investigate
log_format = ENRICHED

# Group allowed to read logs
log_group = audit

# Slight scheduler priority boost
priority_boost = 4


# ============================================================
# WRITE / FLUSH STRATEGY
# ============================================================

# Best desktop/workstation balance
# Lower disk pressure and CPU usage
flush = INCREMENTAL_ASYNC

# Flush every 50 events
freq = 50


# ============================================================
# LOG ROTATION
# ============================================================

# Max single logfile size in MB
max_log_file = 50

# Keep 10 rotated logs
# Total retention ≈ 500MB
num_logs = 10

# Rotate logs automatically
max_log_file_action = ROTATE


# ============================================================
# DISK SPACE HANDLING
# ============================================================

# Remaining free space warning threshold (MB)
space_left = 200

# Critical threshold (MB)
admin_space_left = 50

# Safer for desktop systems
# Avoids panic/halt behavior
space_left_action = SYSLOG
admin_space_left_action = SYSLOG

# If disk completely full
disk_full_action = SYSLOG

# Disk write errors
disk_error_action = SYSLOG

# Optional mail target
action_mail_acct = root


# ============================================================
# HOST IDENTIFICATION
# ============================================================

# Tag logs with hostname
name_format = HOSTNAME

# Optional custom hostname override
# name = workstation-01


# ============================================================
# PERFORMANCE / RELIABILITY
# ============================================================

# Internal audit queue depth
# Helps avoid dropped events under bursts
q_depth = 2000

# Behavior when queue overflows
# SYSLOG = safest workstation option
overflow_action = SYSLOG

# Restart attempts after internal failures
max_restarts = 10

# Multi-record event timeout
end_of_event_timeout = 2


# ============================================================
# REMOTE LOGGING
# ============================================================

# Not acting as central audit collector
distribute_network = no

# TCP wrappers obsolete
use_libwrap = no


# ============================================================
# PLUGIN DIRECTORY
# ============================================================

plugin_dir = /etc/audit/plugins.d