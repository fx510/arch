# DNS configuration for systemd-resolved
# DNS servers will be obtained from DHCP or network configuration
# This file only configures DNS behavior, not specific servers
[Resolve]
# Use DNS over TLS when available (opportunistic mode)
DNSOverTLS=opportunistic

# Note that DNSSEC doesn't fully work yet
# See: https://github.com/systemd/systemd/issues/25676
DNSSEC=allow-downgrade

# Network hardening - disable local network discovery protocols
LLMNR=no
MulticastDNS=no
