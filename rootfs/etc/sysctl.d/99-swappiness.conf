# Disable automatic loading of line discipline modules for TTY devices
dev.tty.ldisc_autoload=0

# Protect named pipes (FIFOs) from being modified by unprivileged users
fs.protected_fifos=2

# Protect regular files from being modified by unprivileged users
fs.protected_regular=2

# Prevent core dumps from being generated for set-user-ID (SUID) programs
fs.suid_dumpable=0

# Set core dump pattern to discard core dumps
kernel.core_pattern=|/bin/false

# Disable the NMI watchdog (interrupt handling watchdog)
kernel.nmi_watchdog=0

# Restrict dmesg log access to privileged users only
kernel.dmesg_restrict=1

# Disable kexec (the ability to load a new kernel while the system is running)
kernel.kexec_load_disabled=1

# Restrict access to kernel pointer values
kernel.kptr_restrict=2

# Restrict performance events to root only
kernel.perf_event_paranoid=3

# Set kernel logging level to limit messages shown to console
kernel.printk=3 3 3 3

# Disable the SysRq key to prevent emergency kernel commands
kernel.sysrq=0

# Disable unprivileged BPF (Berkeley Packet Filter) programs
kernel.unprivileged_bpf_disabled=1

# Prevent attaching to other processes via ptrace
kernel.yama.ptrace_scope=2

# Enable hardening of BPF JIT (Just-in-Time) compiler for network security
net.core.bpf_jit_harden=2

# Disable acceptance of ICMP redirects, which are used to manipulate routing tables
net.ipv4.conf.all.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0

# Disable acceptance of source route packets, used to override routing decisions
net.ipv4.conf.all.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0

# Enable Reverse Path Filtering (RPFilter) to prevent IP spoofing attacks
net.ipv4.conf.all.rp_filter=1
net.ipv6.conf.all.rp_filter=1

# Disable sending of ICMP redirects, which are used to change routing paths
net.ipv4.conf.all.send_redirects=0
net.ipv6.conf.all.send_redirects=0

# Disable automatic acceptance of Router Advertisements (RA) for IPv6
net.ipv6.conf.all.accept_ra=0

# Prevent temporary IPv6 addresses from being generated
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2

# Set the maximum number of memory maps for user processes
vm.max_map_count=1048576

# Control dirty page write-back delay
vm.dirty_writeback_centisecs=6000

# Enable laptop mode to extend battery life by delaying disk writes
vm.laptop_mode=5

# Control the swapping behavior of the system (low value reduces swapping)
vm.swappiness=1

# Prevent unprivileged users from using userfaultfd (a mechanism for handling page faults)
vm.unprivileged_userfaultfd=0

# Log packets that do not have a valid IP address
net.ipv4.conf.all.log_martians=1

# Disable IPv6 if it's not in use
net.ipv6.conf.all.disable_ipv6=1

# Enable protection against SYN flood attacks by limiting the backlog
net.ipv4.tcp_max_syn_backlog=2048

# Enable TCP SYN cookies to mitigate SYN flood attacks
net.ipv4.tcp_syncookies=1

# Disable packet forwarding for both IPv4 and IPv6 (prevents routing between interfaces)
net.ipv4.ip_forward=0
net.ipv6.conf.all.forwarding=0

# Enable ignoring broadcast ICMP echo requests (ping)
net.ipv4.icmp_echo_ignore_broadcasts=1

# Prevent unprivileged attackers from loading vulnerable line disciplines with the TIOCSETD ioctl
dev.tty.ldisc_autoload=0

# Prevent creating files in world-writable directories, protecting against spoofing attacks
fs.protected_fifos=2
fs.protected_regular=2

# Restrict core dumps to prevent sensitive information leakage
fs.suid_dumpable=0
fs.protected_hardlinks=1
fs.protected_symlinks=1

# Address ASLR (Address Space Layout Randomization) to randomize the memory layout, reducing exploitability
vm.mmap_rnd_bits=32
vm.mmap_rnd_compat_bits=16

# Improve system memory management
vm.vfs_cache_pressure=50
vm.mmap_min_addr=65536
vm.swappiness=10
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.overcommit_memory=2
vm.overcommit_ratio=50
vm.unprivileged_userfaultfd=0
kernel.unprivileged_userns_clone=0

# Disable System Request functionality (for debugging) for increased security
kernel.sysrq=0

# Append PID to core dump filenames for better debugging
kernel.core_uses_pid=1

# Limit PID range to prevent exhaustion
kernel.pid_max=65535

# Hide kernel pointer information from unprivileged users
kernel.kptr_restrict=2

# Configure kernel to limit exposure of certain debugging information
kernel.printk=3 3 3 3
kernel.unprivileged_bpf_disabled=1

# Automatically reboot the system after a kernel panic or critical error
kernel.panic=10
kernel.panic_on_oops=1

# Memory Settings
kernel.shmall=268435456
kernel.shmmax=1073741824

# Network Settings
net.core.bpf_jit_harden=2
net.ipv4.conf.all.proxy_arp=0
net.ipv4.neigh.default.gc_thresh1=32
net.ipv4.neigh.default.gc_thresh2=1024
net.ipv4.neigh.default.gc_thresh3=2048

# Control IP packet forwarding and disable source routing to block dangerous traffic
net.ipv4.ip_forward=0
net.ipv4.conf.all.accept_source_route=0

# Enable reverse path filtering for source validation to prevent IP spoofing
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1

# TCP Protection
net.ipv4.tcp_rfc1337=1
net.ipv4.tcp_syn_retries=5
net.ipv4.tcp_synack_retries=2

# ICMP Settings
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.icmp_echo_ignore_all=1
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1

# Disable IPv6 router advertisements to prevent man-in-the-middle attacks
net.ipv6.conf.all.accept_ra=0
net.ipv6.conf.default.accept_ra=0

# IPv6 Security
net.ipv6.conf.all.forwarding=0
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0


